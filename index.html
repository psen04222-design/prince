<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jay kirana store | Artisanal Blends</title>
    <style>
        /* CSS Styling */
        :root {
            --primary-color: #2c4a3e;
            --accent-color: #d4a373;
            --bg-color: #fefae0;
            --text-color: #333333;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .cart-btn {
            background-color: var(--accent-color);
            color: var(--primary-color);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .hero {
            text-align: center;
            padding: 5rem 2rem;
            background: linear-gradient(rgba(44, 74, 62, 0.7), rgba(44, 74, 62, 0.7)), url('https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            color: var(--white);
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .btn {
            background-color: var(--accent-color);
            color: var(--primary-color);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 2rem;
            color: var(--primary-color);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--white);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 1.5rem;
        }
        .card-content h3 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .price {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.2rem;
            margin: 1rem 0;
        }

        footer {
            background-color: var(--primary-color);
            color: var(--white);
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="logo">JAY KIRANA STORE 🍵</div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#menu">Our Teas</a></li>
                <li><button class="cart-btn" id="cartCount">Cart (0)</button></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <h1>Sip the Serenity</h1>
        <p>Discover hand-crafted, organic artisanal tea blends designed to soothe your soul.</p>
        <a href="#menu"><button class="btn">Explore Menu</button></a>
    </section>

    <!-- Dynamic Menu Section -->
    <main class="container" id="menu">
        <h2 class="section-title">Our Signature Blends</h2>
        <div class="menu-grid" id="teaMenuGrid">
            <!-- Dynamic items will be injected via JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Mei Tea Co. All rights reserved.</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Data for the tea products
        const teaProducts = [
            { id: 1, name: "Imperial Jasmine Green", price: 14.99, desc: "Delicate green tea infused with fresh jasmine blossoms.", image: "https://images.unsplash.com/photo-1627435601361-ec25f5b1d0e5?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "Royal Earl Grey", price: 12.50, desc: "Black tea scented with rich oil of bergamot and blue cornflowers.", image: "https://images.unsplash.com/photo-1597481499750-3e6b22637e12?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "Chamomile Twilight", price: 10.99, desc: "Caffeine-free soothing blend of Egyptian chamomile and lavender.", image: "https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "Spiced Chai Master", price: 13.00, desc: "Robust black tea packed with traditional warming Indian spices.", image: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=500&q=80" }
        ];

        let cartCount = 0;

        // Function to render products dynamically
        function renderMenu() {
            const grid = document.getElementById('teaMenuGrid');
            grid.innerHTML = '';

            teaProducts.forEach(tea => {
                const card = document.createElement('div');
                card.classList.add('card');
                
                card.innerHTML = `
                    <img src="${tea.image}" alt="${tea.name}">
                    <div class="card-content">
                        <h3>${tea.name}</h3>
                        <p>${tea.desc}</p>
                        <div class="price">$${tea.price.toFixed(2)}</div>
                        <button class="btn" onclick="addToCart('${tea.name}')">Add to Cart</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Dynamic Cart Functionality
        function addToCart(teaName) {
            cartCount++;
            document.getElementById('cartCount').innerText = `Cart (${cartCount})`;
            alert(`Success! Added "${teaName}" to your cart.`);
        }

        // Initialize the page on load
        window.onload = function() {
            renderMenu();
        };
    </script>
</body>
</html>
